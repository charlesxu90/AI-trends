[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trend"
version = "0.1.0"
description = "Automated topic assignment and trend analysis for AI-conference papers"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2,<3",
    "spacy>=3.4.1,<3.5.0",
    "scispacy==0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
crawl = ["scrapy>=2.11"]       # `ai-trend crawl` (OpenReview spiders)
curate = ["anthropic>=0.40"]   # `ai-trend refresh --curate` (headless AI curation)

[project.scripts]
ai-trend = "ai_trend.cli:main"

[tool.setuptools]
packages = ["ai_trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
